name: CI/CD Pipeline from Private Repo Trigger

on:
  repository_dispatch:
    types: [trigger-from-private]

jobs:
  clone:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Public Repo
        uses: actions/checkout@v3

      - name: Clone Private Repo
        run: |
          git clone https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/11vijays/gate-backend.git app

  test:
    runs-on: ubuntu-latest
    needs: clone

    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: |
          cd app
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          cd app
          pytest

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build & Push Docker Image
        run: |
          cd app
          docker build -t vijaydev11/fastapi-app:latest .
          docker push vijaydev11/fastapi-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: gategroup
          slot-name: Production
          images: vijaydev11/fastapi-app:latest
