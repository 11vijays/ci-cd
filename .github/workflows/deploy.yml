name: Build and Deploy FastAPI Docker App to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Private Repo (FastAPI App)
        run: |
          git clone https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/11vijays/gate-backend.git
          cd app

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker Hub Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build and Push Docker Image to Docker Hub
        run: |
          cd app
          docker build -t vijaydev11/fastapi-app:latest .
          docker push vijaydev11/fastapi-app:latest

      - name: Deploy to Azure Web App (Linux Container)
        uses: azure/webapps-deploy@v2
        with:
          app-name: gategroup
          slot-name: Production
          images: vijaydev11/fastapi-app:latest
